name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod }
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/lint-migrations.sh
  supabase-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - run: supabase db reset
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Seed and RLS checks
        run: |
          DB_URL=$(supabase status -o json | jq -r .DB_URL)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/seed_exercises.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls.sql
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod }
      - name: Backend integration tests (real Postgres)
        working-directory: backend
        run: |
          export TEST_DATABASE_URL=$(supabase status -o json | jq -r .DB_URL)
          go test -count=1 -run Postgres ./internal/analytics/...
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose
